text cx=60 cy=240 label="POTENTIALCRATES: DIG FOR RECORDS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:0
text cx=60 cy=280 label="Tap a crate or tap ROLL. PotentialCrates finds records on Discogs and streams one into your MPC track, ready to" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=312 label="sample." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=360 label="Load it as a plugin instrument (a plugin program). It needs a network connection." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=392 label="CRATES page: eight one-tap digs. Each one searches and plays the first result." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=424 label="DIG page: SEARCH digs with your filters, RESULTS lists 8 a page, tap one to play it." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=456 label="If a dig finds nothing, it digs again with new picks, up to 3 times." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=504 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=240 label="THE EIGHT CRATES" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=280 label="DRUM BREAKS: Funk, Soul, Jazz-Funk, Boogaloo and Afrobeat, 60s and 70s." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=312 label="LIBRARY: library records across Stage & Screen, Jazz and Electronic, 60s to 80s." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=344 label="SOUNDTRACKS: Soundtrack and Score, 60s to 80s." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=376 label="JAZZ-FUNK: Jazz-Funk, Soul-Jazz and Fusion." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=408 label="PSYCH: Psychedelic Rock, Krautrock and psychedelic Soul." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=440 label="BOSSA & SAMBA: Bossanova, Samba, MPB and Bossa Nova jazz." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=472 label="DISCO & BOOGIE: Disco and Boogie, 70s and 80s." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=504 label="DUB & REGGAE: Dub, Roots Reggae and Rocksteady." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=60 cy=240 label="DIG AND FILTERS PAGES" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:2
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=280 label="SEARCH digs Discogs with your filters. Leave them all on ANY for anything at all." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=312 label="FILTERS: genre, style, decade, region and country with arrows. CLEAR FILTERS sets them all back to ANY." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=344 label="ROLL (FILTERS and CRATES pages) picks the filters for you, searches and plays the result." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=376 label="MILD stays in the genre you are in and picks a style of it, 60s or 70s. MEDIUM picks a digger's genre, 50s to" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=84 cy=408 label="90s. WILD picks any genre, style and decade, and sometimes a country." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=440 label="SOURCE: CHANNEL digs random uploads from the YouTube channels you list in channels.txt." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=472 label="PLAY, STOP, BACK 15 and FWD 15 are the transport. NEXT skips to the next result." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=504 label="AUTO NEXT moves on when a track ends or will not play." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=240 label="SAMPLING WHAT YOU FIND" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=280 label="TRANSPORT SYNC: a track loads and waits, silent, until you press Play on the MPC, and the MPC's Stop pauses" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=84 cy=312 label="it. This is for resampling in time." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=344 label="Record the track's output with the MPC's sampler or looper, then chop it." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=376 label="Save what you record into your MELODIC LIBRARY folder for PotentialWax, or your DRUM BREAKS LIBRARY folder" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=84 cy=408 label="for PotentialBreaks, then RESCAN there." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=440 label="The status line says why a track will not play: private video, removed, region blocked, rate limited or no" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=84 cy=472 label="network." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=520 label="Check that you have the right to use what you sample before you release it." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=240 label="WITH THE OTHER PLUGINS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=280 label="Crates finds it, PotentialWax flips melodies, PotentialBreaks chops drums." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=312 label="Dusty Loop chain on a sampled loop: Bleed > Patina > Grit, the same preset name in each." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=344 label="Break Bus chain on sampled drums: Punch > Grit > Bleed > Patina." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=376 label="PotentialNoise gives a balanced rough mix once the beat is built." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=280 label="Your project remembers the filters, source, ROLL setting, SYNC, AUTO NEXT and volume." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=312 label="channels.txt in the plugin's folder lists the YouTube channels for SOURCE: CHANNEL, one per line. The plugin" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=84 cy=344 label="makes it the first time (with your old Crate Digger list, if it finds one)." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=376 label="Streaming needs the MPC online. If nothing plays, check the network first, then the status line." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=408 label="Q-Links: AUTO NEXT and SYNC on DIG, VOLUME and the ROLL setting on CRATES." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=440 label="Looks: Print Plate, Night Rack, Colour Block or Vintage, on the SETTINGS page." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=60 cy=488 label="PotentialCrates is a fork of Crate Digger by sd88me, built on Charles Vestal's schwung-webstream. Thanks to" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=60 cy=520 label="both." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=60 cy=568 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialcrates" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
